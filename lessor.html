<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050000">
<title>ต่ออายุใช้งานเว็บ</title>
<script src="guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r:#ff2a2a;--rg:255,42,42;--bg:#050000;--card:#0d0505;--ln:rgba(255,255,255,.08);--tx:#f3f3f4;--mu:#8a8a8f;--ok:#2fd16b;--wn:#f5a623;
  --f:'Outfit','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f)}
html.chk body{visibility:hidden}
body{min-height:100vh;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(5,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.top h1{margin:0;font-size:17px;font-weight:700;flex:1}
.ib{height:38px;min-width:38px;padding:0 12px;border-radius:11px;border:1px solid var(--ln);background:#120808;color:var(--tx);font:500 13px var(--f);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:active{transform:scale(.96)}
.wrap{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:var(--card);border:1px solid rgba(var(--rg),.17);box-shadow:0 0 40px rgba(var(--rg),.06)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--mu);letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 12px 0 10px;border-radius:99px;background:#240505;border:1px solid #480f0d;color:var(--r);font:600 11px var(--f);letter-spacing:.06em;text-transform:uppercase}
.pill i{width:7px;height:7px;border-radius:50%;background:#94170f}
[data-s=running] .pill{background:#06210f;border-color:#0f4a25;color:var(--ok)}
[data-s=running] .pill i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
[data-s=warn] .pill{background:#2a1b04;border-color:#5a3b08;color:var(--wn)}
[data-s=warn] .pill i{background:var(--wn);box-shadow:0 0 8px var(--wn)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 12px}
.u{text-align:center;padding:12px 4px 9px;border-radius:14px;background:rgba(var(--rg),.08);border:1px solid rgba(var(--rg),.16)}
.u b{display:block;font:700 30px/34px var(--f);font-variant-numeric:tabular-nums}
.u small{display:block;margin-top:2px;font-size:11px;color:var(--mu)}
[data-s=expired] .cd .u b{color:var(--r)}
[data-s=warn] .u b{color:var(--wn)}
.big{font:700 22px/28px var(--f);margin:14px 0 6px}
.sub{margin:0;font-size:13px;color:var(--mu);line-height:1.5}
.bar{height:6px;border-radius:99px;background:#1a0b0b;margin-top:14px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--r),#ff7a5c);transition:width .8s ease}
[data-s=running] .bar>i{background:linear-gradient(90deg,#1fa955,var(--ok))}
[data-s=warn] .bar>i{background:linear-gradient(90deg,#c9830f,var(--wn))}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pk{padding:14px 10px;border-radius:14px;border:1px solid var(--ln);background:#120808;color:var(--tx);font:600 16px var(--f);cursor:pointer;text-align:center;transition:.15s}
.pk small{display:block;margin-top:3px;font:400 11px var(--f);color:var(--mu)}
.pk.sel{border-color:var(--r);background:rgba(var(--rg),.14);box-shadow:0 0 0 1px var(--r) inset}
.cust{display:flex;gap:8px;margin-top:10px;align-items:center}
.cust input,.fld input,.fld textarea{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--ln);background:#0a0404;color:var(--tx);font:500 15px var(--f);outline:none}
.cust input:focus,.fld input:focus{border-color:rgba(var(--rg),.6)}
.cust span{color:var(--mu);font-size:13px}
.prev{margin:14px 0 0;padding:11px 13px;border-radius:12px;background:rgba(var(--rg),.07);border:1px dashed rgba(var(--rg),.25);font-size:13px;color:#d6d6d8;line-height:1.5}
.prev b{color:#fff}
.go{width:100%;height:52px;margin-top:14px;border:0;border-radius:14px;background:var(--r);color:#fff;font:700 16px var(--f);cursor:pointer;box-shadow:0 4px 16px rgba(var(--rg),.35);transition:.15s}
.go:active{transform:scale(.98)}
.go.arm{background:#fff;color:#c40000}
.go[disabled]{opacity:.5;cursor:default}
.ghost{width:100%;height:44px;margin-top:10px;border-radius:12px;border:1px solid rgba(var(--rg),.35);background:transparent;color:var(--r);font:600 14px var(--f);cursor:pointer}
.ghost.arm{background:var(--r);color:#fff}
.fld{display:flex;gap:8px}
.msg{min-height:18px;margin:10px 0 0;font-size:13px;opacity:0;transition:opacity .25s}
.msg.on{opacity:1}.msg.ok{color:var(--ok)}.msg.er{color:#ff6b6b}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#0a0404;border:1px solid var(--ln);font-size:13px;line-height:1.45}
.hist .t{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--ok)}
.hist .cut .t{background:var(--r)}.hist .contact .t{background:#5b8def}
.hist small{display:block;color:var(--mu);font-size:11.5px}
.empty{color:var(--mu);font-size:13px;text-align:center;padding:10px}
.who{font-size:12px;color:var(--mu)}
@media (max-width:380px){.u b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script>document.documentElement.classList.add('chk')</script>

<div class="top">
  <button class="ib" id="bBack" type="button" aria-label="กลับหน้าร้าน">‹ ร้านค้า</button>
  <h1>ต่ออายุใช้งานเว็บ</h1>
  <button class="ib" id="bRef" type="button" aria-label="รีเฟรช">↻</button>
  <button class="ib" id="bOut" type="button">ออก</button>
</div>

<main class="wrap">
  <!-- สถานะ + นับถอยหลัง -->
  <section class="card" id="st" data-s="idle">
    <span class="pill"><i></i><span id="pt">กำลังโหลด…</span></span>
    <div class="cd" id="cd" aria-live="off">
      <div class="u"><b id="kd">--</b><small>วัน</small></div>
      <div class="u"><b id="kh">--</b><small>ชั่วโมง</small></div>
      <div class="u"><b id="km">--</b><small>นาที</small></div>
      <div class="u"><b id="ks">--</b><small>วินาที</small></div>
    </div>
    <p class="big" id="bigT" hidden></p>
    <p class="sub" id="sub">กำลังเชื่อมต่อเซิร์ฟเวอร์…</p>
    <div class="bar"><i id="bar"></i></div>
    <p class="sub who" id="who" style="margin-top:12px"></p>
  </section>

  <!-- ต่ออายุ -->
  <section class="card">
    <h2>ต่ออายุใช้งานเว็บ</h2>
    <div class="grid" id="pks">
      <button class="pk" type="button" data-d="7">7 วัน<small>1 สัปดาห์</small></button>
      <button class="pk sel" type="button" data-d="30">30 วัน<small>1 เดือน</small></button>
      <button class="pk" type="button" data-d="90">90 วัน<small>3 เดือน</small></button>
      <button class="pk" type="button" data-d="365">365 วัน<small>1 ปี</small></button>
    </div>
    <div class="cust"><input id="cDays" type="number" inputmode="numeric" min="1" max="3650" placeholder="กำหนดจำนวนวันเอง"><span>วัน</span></div>
    <div class="fld" style="margin-top:10px"><input id="note" maxlength="120" placeholder="หมายเหตุ (ไม่บังคับ) เช่น ชำระแล้ว"></div>
    <p class="prev" id="prev"></p>
    <button class="go" id="bGo" type="button">ต่ออายุ</button>
    <p class="msg" id="msg" role="alert"></p>
  </section>

  <!-- ช่องทางติดต่อ -->
  <section class="card">
    <h2>ช่องทางติดต่อ (ปุ่ม "ติดต่อ" ตอนเว็บหมดอายุ)</h2>
    <div class="fld"><input id="ct" type="url" placeholder="https://wa.me/856XXXXXXXX"><button class="ib" id="bCt" type="button" style="height:44px">บันทึก</button></div>
    <p class="msg" id="msg2" role="alert"></p>
  </section>

  <!-- ตัดอายุ -->
  <section class="card">
    <h2>ระงับเว็บทันที</h2>
    <p class="sub">ตั้งเวลาให้หมดอายุเดี๋ยวนี้ ลูกค้าจะซื้อ/เติมเงินไม่ได้จนกว่าจะต่ออายุ (ใช้เมื่อผู้เช่าไม่ชำระ)</p>
    <button class="ghost" id="bCut" type="button">ระงับเว็บทันที</button>
    <p class="msg" id="msg3" role="alert"></p>
  </section>

  <!-- ประวัติ -->
  <section class="card">
    <h2>ประวัติการต่ออายุ</h2>
    <ul class="hist" id="hist"><li class="empty" style="display:block;background:none;border:0">—</li></ul>
  </section>
</main>

<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var S = null, off = 0, days = 30, ticker = null, poll = null, armGo = null, armCut = null, busy = false;
  var SOON = 3 * 86400000; /* เหลือ ≤ 3 วัน = เตือนสีส้ม */

  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) { d = new Date(d); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + (d.getFullYear()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function now() { return Date.now() + off; }
  function endMs() { return S && S.ends_at ? new Date(S.ends_at).getTime() : 0; }
  function say(id, t, ok) { var e = $(id); e.textContent = t; e.className = 'msg on ' + (ok ? 'ok' : 'er'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('on'); }, 4500); }
  function call(fn, body) { body = body || {}; body.p_token = exToken(); return exRpc(fn, body); }
  function errText(j) {
    var c = j && j.code;
    return c === 'not_lessor' ? 'บัญชีนี้ไม่มีสิทธิ์ผู้ปล่อยเช่า' : c === 'bad_days' ? 'จำนวนวันต้องอยู่ระหว่าง 1–3650' : c === 'bad_url' ? 'ลิงก์ต้องขึ้นต้นด้วย https:// , tel: หรือ mailto:' : 'ทำรายการไม่สำเร็จ กรุณาลองใหม่';
  }

  /* ----- วาดสถานะ ----- */
  function state() {
    if (!S || S.state === 'idle') return 'idle';
    var r = endMs() - now();
    if (r <= 0) return 'expired';
    return r <= SOON ? 'warn' : 'running';
  }
  function draw() {
    var st = state(), root = $('st'), r = Math.max(0, endMs() - now());
    root.dataset.s = st;
    $('pt').textContent = st === 'expired' ? 'Website Status: Expired' : st === 'idle' ? 'Website Status: Not started' : st === 'warn' ? 'ใกล้หมดอายุ' : 'Website Status: Active';
    var t = Math.floor(r / 1000);
    $('kd').textContent = st === 'idle' ? '--' : String(Math.floor(t / 86400));
    $('kh').textContent = st === 'idle' ? '--' : p2(Math.floor(t % 86400 / 3600));
    $('km').textContent = st === 'idle' ? '--' : p2(Math.floor(t % 3600 / 60));
    $('ks').textContent = st === 'idle' ? '--' : p2(t % 60);
    var big = $('bigT');
    if (st === 'expired') { big.hidden = false; big.textContent = 'เว็บหมดอายุแล้ว'; $('sub').textContent = 'ลูกค้าซื้อและเติมเงินไม่ได้ · หมดอายุเมื่อ ' + fmt(S.ends_at); }
    else if (st === 'idle') { big.hidden = false; big.textContent = 'ยังไม่เริ่มนับ'; $('sub').textContent = 'กดต่ออายุเพื่อเริ่มนับเวลา'; }
    else { big.hidden = true; $('sub').textContent = 'หมดอายุ ' + fmt(S.ends_at) + (st === 'warn' ? ' · เหลือไม่ถึง 3 วัน ควรต่ออายุ' : ''); }
    var pct = 0;
    if (S && S.started_at && S.ends_at && st !== 'idle') { var a = new Date(S.started_at).getTime(), b = endMs(); pct = Math.max(0, Math.min(100, (b - now()) / Math.max(1, b - a) * 100)); }
    $('bar').style.width = pct + '%';
    preview();
  }
  function tick() {
    if (!S) return; draw();
    if (S.state === 'running' && endMs() - now() <= 0) { S.state = 'expired'; load(); }
  }

  /* ----- ตัวอย่างวันหมดอายุใหม่ ----- */
  function preview() {
    var d = days;
    if (!d) { $('prev').innerHTML = 'ระบุจำนวนวัน 1–3650 วัน'; return; }
    var base = Math.max(endMs(), now()), ne = base + d * 86400000;
    $('prev').innerHTML = 'ต่อ <b>' + d + ' วัน</b> → หมดอายุใหม่ <b>' + fmt(ne) + '</b>' + (endMs() > now() ? ' (ต่อจากวันหมดเดิม)' : ' (นับจากตอนนี้)');
  }
  function setDays(d) {
    days = d; document.querySelectorAll('.pk').forEach(function (b) { b.classList.toggle('sel', Number(b.dataset.d) === d && !$('cDays').value); });
    resetGo(); preview();
  }
  function resetGo() { clearTimeout(armGo); var b = $('bGo'); b.classList.remove('arm'); b.disabled = false; b.textContent = 'ต่ออายุ'; }
  function resetCut() { clearTimeout(armCut); var b = $('bCut'); b.classList.remove('arm'); b.textContent = 'ระงับเว็บทันที'; }

  /* ----- ประวัติ ----- */
  function drawHist() {
    var ul = $('hist'), h = (S && S.history) || [];
    if (!h.length) { ul.innerHTML = '<li class="empty" style="display:block;background:none;border:0">ยังไม่มีประวัติ</li>'; return; }
    ul.innerHTML = '';
    h.forEach(function (x) {
      var li = document.createElement('li'); li.className = x.action;
      var t = x.action === 'renew' ? 'ต่ออายุ +' + x.days + ' วัน' : x.action === 'cut' ? 'ระงับเว็บทันที' : 'ตั้งช่องทางติดต่อ';
      var d = x.action === 'renew' ? 'หมดอายุใหม่ ' + fmt(x.new_ends_at) : x.action === 'cut' ? 'ตัดเมื่อ ' + fmt(x.new_ends_at) : (x.note || '(ลบลิงก์)');
      var n = x.action === 'renew' && x.note ? ' · ' + x.note : '';
      li.innerHTML = '<span class="t"></span><div><b></b><small></small></div>';
      li.querySelector('b').textContent = t;
      li.querySelector('small').textContent = fmt(x.at) + ' · ' + x.by_username + ' · ' + d + n;
      ul.appendChild(li);
    });
  }

  /* ----- โหลดจากเซิร์ฟเวอร์ ----- */
  function load() {
    return call('lessor_status').then(function (j) {
      if (!j || !j.ok) { if (j && j.code === 'not_lessor') location.replace('index.html'); return; }
      S = j; off = new Date(j.now).getTime() - Date.now();
      $('who').textContent = 'บัญชี: ' + j.username;
      if (document.activeElement !== $('ct')) $('ct').value = j.contact_url || '';
      draw(); drawHist();
      if (!ticker) ticker = setInterval(tick, 1000);
    }).catch(function () { $('sub').textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ · กด ↻ เพื่อลองใหม่'; });
  }

  /* ----- ปุ่มต่าง ๆ ----- */
  document.querySelectorAll('.pk').forEach(function (b) { b.addEventListener('click', function () { $('cDays').value = ''; setDays(Number(b.dataset.d)); }); });
  $('cDays').addEventListener('input', function () {
    var v = parseInt(this.value, 10); document.querySelectorAll('.pk').forEach(function (b) { b.classList.remove('sel'); });
    days = (v >= 1 && v <= 3650) ? v : 0; resetGo(); preview();
  });
  $('bGo').addEventListener('click', function () {
    if (busy || !days) return;
    var b = this;
    if (!b.classList.contains('arm')) {            /* แตะครั้งแรก = ขอยืนยัน */
      b.classList.add('arm'); b.textContent = 'แตะอีกครั้งเพื่อยืนยันต่อ ' + days + ' วัน';
      clearTimeout(armGo); armGo = setTimeout(resetGo, 4000); return;
    }
    clearTimeout(armGo); busy = true; b.disabled = true; b.textContent = 'กำลังต่ออายุ…';
    call('lessor_renew', { p_days: days, p_note: $('note').value }).then(function (j) {
      busy = false; resetGo();
      if (j && j.ok) { $('note').value = ''; say('msg', 'ต่ออายุสำเร็จ +' + days + ' วัน', true); return load(); }
      say('msg', errText(j));
    }).catch(function () { busy = false; resetGo(); say('msg', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่'); });
  });
  $('bCt').addEventListener('click', function () {
    call('lessor_set_contact', { p_url: $('ct').value }).then(function (j) {
      if (j && j.ok) { say('msg2', 'บันทึกช่องทางติดต่อแล้ว', true); load(); } else say('msg2', errText(j));
    }).catch(function () { say('msg2', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); });
  });
  $('bCut').addEventListener('click', function () {
    if (busy) return; var b = this;
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'แตะอีกครั้งเพื่อยืนยันระงับเว็บ'; clearTimeout(armCut); armCut = setTimeout(resetCut, 4000); return; }
    clearTimeout(armCut); busy = true;
    call('lessor_cut', { p_note: $('note').value }).then(function (j) {
      busy = false; resetCut();
      if (j && j.ok) { say('msg3', 'ระงับเว็บแล้ว', true); load(); } else say('msg3', errText(j));
    }).catch(function () { busy = false; resetCut(); say('msg3', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); });
  });
  $('bRef').addEventListener('click', load);
  $('bBack').addEventListener('click', function () { location.href = 'index.html'; });
  $('bOut').addEventListener('click', function () { if (confirm('ออกจากระบบ?')) exLogout(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

  /* ----- กั้นหน้า: เฉพาะผู้ปล่อยเช่า (ตรวจจริงซ้ำฝั่ง Supabase ทุกฟังก์ชัน) ----- */
  (function gate() {
    var root = document.documentElement;
    if (!exToken()) { exNeedLogin('lessor.html'); return; }
    call('member_is_lessor').then(function (j) {
      if (j && j.ok && j.lessor) { root.classList.remove('chk'); setDays(30); load(); poll = setInterval(load, 60000); }
      else location.replace('index.html');
    }).catch(function () { location.replace('index.html'); });
  })();
})();
</script>
</body>
</html>
